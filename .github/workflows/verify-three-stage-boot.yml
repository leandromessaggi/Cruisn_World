name: Verify original three-stage boot interfaces (no ROM)
on:
  workflow_dispatch:
  push:
    branches: [recomp-android]
    paths:
      - '.github/workflows/verify-three-stage-boot.yml'
      - 'recomp-android/runtime/boot_multithread_probe.*'
      - 'recomp-android/tests/test_boot_multithread_probe.cpp'
      - 'recomp-android/tests/boot_fixture/recomp.h'
      - 'recomp-android/tests/private_original_three_stage_boot.cpp'
      - 'recomp-android/tools/verify_private_three_stage_boot.py'
permissions:
  contents: read
jobs:
  verify-interfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests without ROM
        run: |
          set -euo pipefail
          python3 -m py_compile recomp-android/tools/verify_private_three_stage_boot.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I recomp-android/tests/boot_fixture -I recomp-android/runtime \
            recomp-android/runtime/boot_multithread_probe.cpp \
            recomp-android/tests/test_boot_multithread_probe.cpp \
            -o /tmp/cw19-native-tests
          /tmp/cw19-native-tests
      - name: Compile guest hooks with Android NDK ARM64
        run: |
          set -euo pipefail
          NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1 || true)
          if [[ -z "$NDK" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.2.12479018'
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK=$NDK LLVM=$LLVM"
          df -h /tmp
          ls -lh "$LLVM/aarch64-linux-android28-clang++" "$LLVM/llvm-readelf" "$LLVM/llvm-nm"
          set -x
          "$LLVM/aarch64-linux-android28-clang++" -std=c++17 -O2 -fPIC -Wall -Wextra -Werror \
            -I recomp-android/tests/boot_fixture -I recomp-android/runtime \
            -c recomp-android/runtime/boot_multithread_probe.cpp -o /tmp/cw19-arm64.o
          echo 'Clang completed; inspecting ELF:'
          "$LLVM/llvm-readelf" -h /tmp/cw19-arm64.o > /tmp/cw19-elf.txt
          grep -q AArch64 /tmp/cw19-elf.txt
          echo 'readelf completed; checking exported symbols:'
          "$LLVM/llvm-nm" --defined-only /tmp/cw19-arm64.o > /tmp/cw19-symbols.txt
          for symbol in osCreateThread_recomp osStartThread_recomp osCreatePiManager_recomp osSetThreadPri_recomp osCreateMesgQueue_recomp; do
            grep -Eq " [TW] ${symbol}$" /tmp/cw19-symbols.txt
          done
          echo 'PASS: bounded three-stage guest hooks built for Android ARM64'
      - name: Reject commercial ROM and generated game code in GitHub
        run: |
          set -euo pipefail
          if find recomp-android -type f \( -name 'funcs_[0-9]*.c' -o -name '*.z64' -o -name '*.n64' -o -name '*.v64' \) -print | grep -q .; then
            echo 'Refusing original game content in public branch'; exit 1
          fi
