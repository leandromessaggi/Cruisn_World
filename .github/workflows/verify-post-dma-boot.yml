name: Verify original post-DMA boot boundary (no ROM)
on:
  workflow_dispatch:
  push:
    branches: [recomp-android]
    paths:
      - '.github/workflows/verify-post-dma-boot.yml'
      - 'recomp-android/tests/private_original_post_dma_boot.cpp'
      - 'recomp-android/tools/verify_private_post_dma_boot.py'
permissions:
  contents: read
jobs:
  probe-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate public C++ hooks and adjacent unit tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            recomp-android/tools/verify_private_post_dma_boot.py \
            recomp-android/tools/verify_private_cic6106.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I recomp-android/runtime \
            recomp-android/runtime/cic6106_seed.cpp \
            recomp-android/tests/test_cic6106_seed.cpp \
            -o /tmp/cw-seed
          /tmp/cw-seed
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I recomp-android/tests/boot_fixture -I recomp-android/runtime \
            recomp-android/runtime/boot_multithread_probe.cpp \
            recomp-android/tests/test_boot_pi_dma_probe.cpp \
            -o /tmp/cw-dma
          /tmp/cw-dma
      - name: Keep ROM and ROM-derived generated code private
        run: |
          set -euo pipefail
          if find recomp-android -type f \( -name 'funcs_[0-9]*.c' -o -name '*.z64' -o -name '*.n64' -o -name '*.v64' \) -print | grep -q .; then
            echo 'Private ROM/game CPU code detected'; exit 1
          fi
