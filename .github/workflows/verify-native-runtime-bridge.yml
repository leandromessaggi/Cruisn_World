name: Verify initial N64Recomp runtime bridge (ROM-free)
on:
  workflow_dispatch:
  push:
    branches: [recomp-android]
    paths:
      - '.github/workflows/verify-native-runtime-bridge.yml'
      - 'recomp-android/runtime/basic_os_hooks.cpp'
      - 'recomp-android/tools/verify_native_entrypoint.py'
      - 'recomp-android/tests/native_entrypoint_probe.c'
      - 'recomp-android/tests/test_native_entrypoint_probe.py'
      - 'recomp-android/tests/test_basic_os_hooks.cpp'
      - 'recomp-android/tests/fixtures/recomp.h'
permissions:
  contents: read
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test entrypoint harness with synthetic code (never claims original boot)
        run: python3 recomp-android/tests/test_native_entrypoint_probe.py
      - name: Test seven libultra ABI hooks with a synthetic context
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I recomp-android/tests/fixtures \
            recomp-android/runtime/basic_os_hooks.cpp \
            recomp-android/tests/test_basic_os_hooks.cpp \
            -o /tmp/cw_os_hook_test
          /tmp/cw_os_hook_test
      - name: Compile actual bridge implementation for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1 || true)
          if [[ -z "$NDK" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.2.12479018'
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "Selected NDK: $NDK"
          ls -l "$LLVM/aarch64-linux-android28-clang++" "$LLVM/llvm-readelf" "$LLVM/llvm-nm"
          "$LLVM/aarch64-linux-android28-clang++" --version
          echo "Compiling AArch64 object"
          "$LLVM/aarch64-linux-android28-clang++" -std=c++17 -O2 -fPIC -fno-lto \
            -I recomp-android/tests/fixtures \
            -c recomp-android/runtime/basic_os_hooks.cpp -o /tmp/cw_basic_os_hooks.o
          echo "Inspecting ELF machine type"
          readelf -h /tmp/cw_basic_os_hooks.o | grep -q AArch64
          "$LLVM/llvm-nm" --defined-only /tmp/cw_basic_os_hooks.o > /tmp/hooks.symbols
          for name in osCreateMesgQueue_recomp osSendMesg_recomp osRecvMesg_recomp \
                      osVirtualToPhysical_recomp osInvalDCache_recomp \
                      osWritebackDCache_recomp osWritebackDCacheAll_recomp; do
            grep -qE " [TW] ${name}$" /tmp/hooks.symbols || { echo "Missing export $name"; exit 1; }
          done
          echo 'PASS: Android NDK AArch64 object exports all seven ABI symbols'
