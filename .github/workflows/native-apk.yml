name: Build Native Racing APK
on:
  push:
    branches: [native-android-port]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Compile native Android APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: native-android
      - name: Publish installer
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeWorldRacing-Nativo-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
