name: Verify original VI host-stack continuation (ROM-free)
on:
  workflow_dispatch:
  push:
    branches: [recomp-android]
    paths:
      - '.github/workflows/verify-original-vi-continuation.yml'
      - 'recomp-android/runtime/boot_multithread_probe.hpp'
      - 'recomp-android/runtime/boot_multithread_probe.cpp'
      - 'recomp-android/tests/test_boot_vi_setup_probe.cpp'
      - 'recomp-android/tests/private_original_vi_continuation.cpp'
      - 'recomp-android/tools/verify_private_vi_continuation.py'
      - 'recomp-android/docs/VI_HOST_STACK_RESUME_V026.md'
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ROM-free VI register, native stack wait/resume, FIFO and DMA regression
        run: |
          set -euo pipefail
          python3 -m py_compile recomp-android/tools/verify_private_vi_continuation.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -I recomp-android/tests/boot_fixture -I recomp-android/runtime \
            recomp-android/runtime/boot_multithread_probe.cpp \
            recomp-android/tests/test_boot_vi_setup_probe.cpp \
            -o /tmp/cw-v026-vi-test
          timeout 15 /tmp/cw-v026-vi-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -I recomp-android/tests/boot_fixture -I recomp-android/runtime \
            recomp-android/runtime/boot_multithread_probe.cpp \
            recomp-android/tests/test_boot_pi_dma_probe.cpp \
            -o /tmp/cw-v026-pi-test
          timeout 15 /tmp/cw-v026-pi-test
      - name: Reject ROM and generated game source
        run: |
          if find recomp-android -type f \( -name '*.z64' -o -name '*.n64' -o -name '*.v64' -o -name 'funcs_[0-9]*.c' \) -print | grep -q .; then
            echo 'ROM or ROM-derived source cannot be committed publicly'; exit 1
          fi
