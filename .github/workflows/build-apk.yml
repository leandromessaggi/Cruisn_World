name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'platform-tools'
      - name: Icon SVG renderer
        run: python3 -m pip install --user cairosvg
      - name: Prepare Android app
        run: python3 build_game.py --prepare-only
      - name: Compile
        working-directory: android-project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Collect APK
        run: |
          mkdir -p dist
          APK="$(find android-project/app/build/outputs/apk/release -type f -name '*universal*release*.apk' -print -quit)"
          if [ -z "$APK" ]; then APK="$(find android-project/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"; fi
          test -s "$APK"
          cp "$APK" dist/CruisnWorld-arm64.apk
          cd dist && sha256sum CruisnWorld-arm64.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CruisnWorld-arm64-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error
